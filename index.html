    <script>
      // Apply the saved appearance before first paint so the page never flashes.
      ;(function () {
        try {
          var preference = localStorage.getItem('site_theme') || 'system'
          var dark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          root.style.colorScheme = dark ? 'dark' : 'light'
          var language = localStorage.getItem('site_language')
          if (language) root.lang = language
        } catch (error) {
          /* private mode: keep the defaults */
        }
      })()
    </script>
